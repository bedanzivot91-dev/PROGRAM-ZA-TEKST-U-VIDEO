name: Build Windows installer

on:
  push:
    branches: [main]
    paths:
      - "SOURCE/**"
      - "INSTALIRAJ-PROGRAM.bat"
      - "SASTAVI-PROGRAM.bat"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: SOURCE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SOURCE/package-lock.json

      - name: Install FFmpeg
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        run: npm ci

      - name: Windows JavaScript syntax check
        shell: pwsh
        run: |
          node --check "PROGRAM - NE BRISATI/public/app.js"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Node syntax check failed for app.js"
            exit $LASTEXITCODE
          }

      - name: Static tests
        run: npm run test:static

      - name: Server tests
        run: npm run test:server

      - name: Complete module tests
        run: npm test

      - name: Build NSIS and portable EXE
        run: npm run dist:all

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Muzicki-Spot-Studio-Free-Windows-v15.6.0
          path: |
            SOURCE/dist/*.exe
            SOURCE/dist/*.yml
            SOURCE/dist/*.blockmap
          if-no-files-found: error
          retention-days: 30

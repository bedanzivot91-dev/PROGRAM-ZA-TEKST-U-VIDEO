name: Build Windows installer

on:
  push:
    branches:
      - main
      - "chatgpt/**"
    paths:
      - "SOURCE/**"
      - "INSTALIRAJ-PROGRAM.bat"
      - "SASTAVI-PROGRAM.bat"
      - "SASTAVI-PROGRAM-PORTABLE.bat"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: SOURCE
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SOURCE/package-lock.json

      - name: Install FFmpeg
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version
          ffprobe -version

      - name: Synchronize package-lock and patched transitive dependencies
        run: npm install --package-lock-only --ignore-scripts

      # Build mora da bude read-only prema izvornoj grani. Deep-audit workflow je jedini
      # koji sme da commit-uje popravljeni lockfile/integrity manifest na repair grani.
      # Ranije su ova dva workflow-a paralelno pushovala istu granu i Windows build je
      # nasumično padao sa non-fast-forward greškom pre nego što bi testovi uopšte počeli.
      - name: Report locally synchronized lockfile
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          git diff --quiet -- SOURCE/package-lock.json
          if ($LASTEXITCODE -eq 0) {
            Write-Host "package-lock.json je već sinhronizovan."
          } else {
            Write-Host "package-lock.json je sinhronizovan samo u build workspace-u; deep-audit je odgovoran za trajni commit."
            git diff --stat -- SOURCE/package-lock.json
          }
          exit 0

      - name: Install dependencies
        run: npm ci

      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Windows JavaScript syntax check
        shell: pwsh
        run: |
          node --check "PROGRAM - NE BRISATI/public/app.js"
          node --check "PROGRAM - NE BRISATI/public/completion-ui.js"
          node --check "PROGRAM - NE BRISATI/public/workflow-tools-ui.js"
          node --check "desktop/main.js"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Node syntax check failed"
            exit $LASTEXITCODE
          }

      - name: Static tests
        run: npm run test:static

      - name: Server tests
        run: npm run test:server

      - name: Electron desktop smoke tests
        run: npm run test:electron

      - name: Complete module tests
        run: npm test

      - name: Build NSIS and portable EXE
        run: npm run dist:all

      - name: Real installed and portable EXE runtime smoke test
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Filter "Muzicki-Spot-Studio-Free-Setup-v15.6.1.exe" | Select-Object -First 1
          $portable = Get-ChildItem -Path dist -Filter "Muzicki-Spot-Studio-Free-Portable-v15.6.1.exe" | Select-Object -First 1
          if (-not $setup -or -not $portable) { throw "Setup ili Portable v15.6.1 EXE nije pronađen." }
          & ./scripts/test-built-windows-artifacts.ps1 -SetupPath $setup.FullName -PortablePath $portable.FullName -ExpectedVersion "15.6"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Split package round-trip smoke test
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          function Test-SplitRoundTrip([System.IO.FileInfo]$source) {
            $dir = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetRandomFileName())
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            $chunkSize = 9MB
            $input = [IO.File]::OpenRead($source.FullName)
            try {
              $index = 1
              $buffer = New-Object byte[] $chunkSize
              while (($read = $input.Read($buffer, 0, $buffer.Length)) -gt 0) {
                $part = Join-Path $dir ("{0}.part{1:D3}" -f $source.Name, $index)
                $output = [IO.File]::Create($part)
                try { $output.Write($buffer, 0, $read) } finally { $output.Dispose() }
                $index++
              }
            } finally { $input.Dispose() }
            $rebuilt = Join-Path $dir ("rebuilt-" + $source.Name)
            $out = [IO.File]::Create($rebuilt)
            try {
              Get-ChildItem $dir -Filter ($source.Name + '.part*') | Sort-Object Name | ForEach-Object {
                $partIn = [IO.File]::OpenRead($_.FullName)
                try { $partIn.CopyTo($out) } finally { $partIn.Dispose() }
              }
            } finally { $out.Dispose() }
            $a = (Get-FileHash -Algorithm SHA256 $source.FullName).Hash
            $b = (Get-FileHash -Algorithm SHA256 $rebuilt).Hash
            if ($a -ne $b) { throw "Split/rebuild SHA-256 mismatch za $($source.Name)" }
            Remove-Item $dir -Recurse -Force
          }
          $setup = Get-ChildItem SOURCE/dist -Filter "Muzicki-Spot-Studio-Free-Setup-v15.6.1.exe" | Select-Object -First 1
          $portable = Get-ChildItem SOURCE/dist -Filter "Muzicki-Spot-Studio-Free-Portable-v15.6.1.exe" | Select-Object -First 1
          if (-not $setup -or -not $portable) { throw "Setup ili Portable v15.6.1 EXE nedostaje za split test." }
          Test-SplitRoundTrip $setup
          Test-SplitRoundTrip $portable

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Muzicki-Spot-Studio-Free-Windows-v15.6.1
          path: |
            SOURCE/dist/*.exe
            SOURCE/dist/*.yml
            SOURCE/dist/*.blockmap
          if-no-files-found: error
          retention-days: 30

      - name: Refresh repository INSTALLER and PORTABLE parts
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          # Build može da traje nekoliko minuta. Ako je main u međuvremenu napredovao,
          # paketi se smeju preneti samo ako je SOURCE stablo i dalje potpuno isto kao
          # ono iz kog su EXE fajlovi upravo izgrađeni i testirani.
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $builtSourceTree = (git rev-parse "${env:GITHUB_SHA}:SOURCE").Trim()
          $latestSourceTree = (git rev-parse "origin/main:SOURCE").Trim()
          if ($builtSourceTree -ne $latestSourceTree) {
            throw "main SOURCE je promenjen tokom builda. Odbijam da objavim zastarele pakete; noviji main build će ih napraviti."
          }
          # Ukloni samo lokalne tracked izmene nastale tokom builda; dist ostaje netaknut
          # jer je generisan/ignorisan. Zatim bezbedno prenesi ovaj završni package commit
          # na trenutno najnoviji main.
          git reset --hard $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rebase origin/main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          function Write-SplitParts([System.IO.FileInfo]$source, [string]$destination) {
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            Get-ChildItem $destination -Filter "*.exe.part*" -ErrorAction SilentlyContinue | Remove-Item -Force
            Get-ChildItem $destination -Filter "*.exe" -ErrorAction SilentlyContinue | Remove-Item -Force
            $chunkSize = 9MB
            $input = [IO.File]::OpenRead($source.FullName)
            try {
              $index = 1
              $buffer = New-Object byte[] $chunkSize
              while (($read = $input.Read($buffer, 0, $buffer.Length)) -gt 0) {
                $part = Join-Path $destination ("{0}.part{1:D3}" -f $source.Name, $index)
                $output = [IO.File]::Create($part)
                try { $output.Write($buffer, 0, $read) } finally { $output.Dispose() }
                $index++
              }
            } finally { $input.Dispose() }
          }
          $setup = Get-ChildItem SOURCE/dist -Filter "Muzicki-Spot-Studio-Free-Setup-v15.6.1.exe" | Select-Object -First 1
          $portable = Get-ChildItem SOURCE/dist -Filter "Muzicki-Spot-Studio-Free-Portable-v15.6.1.exe" | Select-Object -First 1
          if (-not $setup -or -not $portable) { throw "Finalni v15.6.1 Setup/Portable nisu pronađeni." }
          Write-SplitParts $setup "INSTALLER"
          Write-SplitParts $portable "PORTABLE"
          $setupHash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToLowerInvariant()
          $portableHash = (Get-FileHash -Algorithm SHA256 $portable.FullName).Hash.ToLowerInvariant()
          $checksumText = @(
            "PROGRAM ZA TEKST U VIDEO v15.6.1 - TESTIRANI BUILD",
            "Source commit: $env:GITHUB_SHA",
            "",
            "INSTALLER/$($setup.Name)",
            $setupHash,
            "",
            "PORTABLE/$($portable.Name)",
            $portableHash,
            ""
          ) -join "`r`n"
          [IO.File]::WriteAllText((Join-Path $PWD 'CHECKSUMS-SHA256.txt'), $checksumText, [Text.UTF8Encoding]::new($false))
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INSTALLER PORTABLE CHECKSUMS-SHA256.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Repo paketi su već usklađeni sa buildom."
          } else {
            git commit -m "Refresh tested v15.6.1 Windows packages"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

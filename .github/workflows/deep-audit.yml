name: Deep whole-program audit

on:
  push:
    branches:
      - main
      - 'chatgpt/deep-audit-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  deep-audit:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SOURCE/package-lock.json

      - name: Install dependencies
        working-directory: SOURCE
        shell: pwsh
        run: npm ci

      - name: Production dependency security audit
        working-directory: SOURCE
        shell: pwsh
        run: npm audit --omit=dev --audit-level=high

      - name: Deep audit every source layer
        working-directory: SOURCE
        shell: pwsh
        run: node tests/test-deep-audit.js

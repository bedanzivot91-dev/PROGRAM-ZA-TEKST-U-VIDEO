name: Deep whole-program audit

on:
  push:
    branches:
      - main
      - 'chatgpt/deep-audit-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  deep-audit:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SOURCE/package-lock.json

      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        working-directory: SOURCE
        shell: pwsh
        run: npm ci

      - name: Production dependency security audit
        working-directory: SOURCE
        shell: pwsh
        run: npm audit --omit=dev --audit-level=high

      - name: Deep audit every source layer
        working-directory: SOURCE
        shell: pwsh
        run: node tests/test-deep-audit.js

      - name: Complete test suite with V8 coverage
        working-directory: SOURCE
        shell: pwsh
        run: |
          if (Test-Path .v8-coverage) { Remove-Item .v8-coverage -Recurse -Force }
          $env:NODE_V8_COVERAGE = (Join-Path $PWD '.v8-coverage')
          npm test
          node tests/analyze-v8-coverage.js

name: Deep whole-program audit

on:
  push:
    branches:
      - main
      - 'chatgpt/deep-audit-*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  deep-audit:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SOURCE/package-lock.json

      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        working-directory: SOURCE
        shell: pwsh
        run: npm ci

      - name: Apply audited dependency fixes on deep-audit branch
        if: startsWith(github.ref, 'refs/heads/chatgpt/deep-audit-')
        working-directory: SOURCE
        shell: pwsh
        run: |
          npm audit fix
          npm audit --audit-level=high

      - name: Synchronize runtime versions on deep-audit branch
        if: startsWith(github.ref, 'refs/heads/chatgpt/deep-audit-')
        working-directory: SOURCE
        shell: pwsh
        run: node scripts/sync-runtime-versions.js

      - name: Verify runtime versions
        working-directory: SOURCE
        shell: pwsh
        run: node scripts/sync-runtime-versions.js --check

      - name: Production dependency security audit
        working-directory: SOURCE
        shell: pwsh
        run: npm audit --omit=dev --audit-level=high

      - name: Full dependency security audit including build tools
        id: dependency_audit
        continue-on-error: true
        working-directory: SOURCE
        shell: pwsh
        run: npm audit --audit-level=high

      - name: Regenerate integrity manifest from actual files
        working-directory: SOURCE
        shell: pwsh
        run: node scripts/generate-integrity-manifest.js --write

      - name: Commit synchronized dependencies, runtime versions and manifest on deep-audit branch
        if: startsWith(github.ref, 'refs/heads/chatgpt/deep-audit-')
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "SOURCE/package.json" "SOURCE/package-lock.json" "SOURCE/desktop/preload.js" "SOURCE/PROGRAM - NE BRISATI/background-worker.js" "SOURCE/PROGRAM - NE BRISATI/launcher.js" "SOURCE/PROGRAM - NE BRISATI/server.js" "SOURCE/PROGRAM - NE BRISATI/research-engine.js" "SOURCE/PROGRAM - NE BRISATI/INTEGRITET-FAJLOVA-SHA256.txt"
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Dependencies, runtime verzije i integrity manifest su već sinhronizovani."
          } else {
            git commit -m "Synchronize audited dependencies runtime versions and v15.6.1 integrity manifest"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:${{ github.ref_name }}
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify main/PR manifest is committed and current
        if: ${{ !startsWith(github.ref, 'refs/heads/chatgpt/deep-audit-') }}
        shell: pwsh
        run: |
          git diff --exit-code -- "SOURCE/PROGRAM - NE BRISATI/INTEGRITET-FAJLOVA-SHA256.txt"
          node scripts/sync-runtime-versions.js --check

      - name: Deep static and structural audit
        id: deep_audit
        continue-on-error: true
        working-directory: SOURCE
        shell: pwsh
        run: node tests/test-deep-audit-v2.js

      - name: Complete existing test suite without instrumentation
        id: full_tests
        continue-on-error: true
        working-directory: SOURCE
        shell: pwsh
        run: npm test

      - name: Backend and Electron V8 function coverage
        if: always()
        id: coverage
        continue-on-error: true
        working-directory: SOURCE
        shell: pwsh
        run: |
          node tests/run-v8-coverage-suite.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/analyze-v8-coverage.js

      - name: Fail when any audit layer failed
        if: ${{ always() && (steps.dependency_audit.outcome != 'success' || steps.deep_audit.outcome != 'success' || steps.full_tests.outcome != 'success' || steps.coverage.outcome != 'success') }}
        shell: pwsh
        run: |
          Write-Error "Dubinski audit nije zelen. dependencies=${{ steps.dependency_audit.outcome }} deep=${{ steps.deep_audit.outcome }} tests=${{ steps.full_tests.outcome }} coverage=${{ steps.coverage.outcome }}"
          exit 1

      - name: Confirm green audit
        if: ${{ always() && steps.dependency_audit.outcome == 'success' && steps.deep_audit.outcome == 'success' && steps.full_tests.outcome == 'success' && steps.coverage.outcome == 'success' }}
        shell: pwsh
        run: Write-Host "Svi slojevi dubinskog audita su zeleni."
